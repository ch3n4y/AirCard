[workspace]
resolver = "2"
members = ["src-tauri", "crates/aircard-core", "crates/aircard-device", "crates/aircard-apple-ffi"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ch3n4y/AirCard"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Read the optimization guideline for more details:
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
