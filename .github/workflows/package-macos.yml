name: Package macOS

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-tests
          workspaces: ". -> target"
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - run: npm run test:ui
      - run: cargo test --workspace --locked

  package:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal
          workspaces: ". -> target"
      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build universal app
        run: npm run tauri -- build --target universal-apple-darwin --bundles app
      - name: Sign and package
        run: ./scripts/package-macos.sh target/universal-apple-darwin/release/bundle/macos/AirCard.app
      - uses: actions/upload-artifact@v4
        with:
          name: AirCard-macOS-universal
          path: target/universal-apple-darwin/release/bundle/dmg/AirCard-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
